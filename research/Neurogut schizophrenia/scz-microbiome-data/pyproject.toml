[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scz-data"
version = "0.1.0"
description = "Retrieval and harmonisation of schizophrenia gut metagenome cohorts (GutMIND Table S1)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "requests>=2.31",
  "pyarrow>=14",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
scz-data = "scz_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
