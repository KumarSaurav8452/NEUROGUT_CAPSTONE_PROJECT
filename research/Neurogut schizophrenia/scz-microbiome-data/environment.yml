# Bio tools pinned to the versions used by GutMIND (Ju et al. 2026, Methods).
# Phase 1 (config + metadata + labels) needs only the Python part.
name: scz-data
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pandas>=2.1
  - openpyxl>=3.1
  - pyyaml>=6.0
  - requests>=2.31
  - pyarrow>=14
  - pytest>=8
  - snakemake-minimal>=8
  - aria2
  - fastp=0.23.2
  - bowtie2=2.5.3
  - samtools
  - metaphlan=4.0.6
  - humann=3.9
  - pip
  - pip:
      - -e .
